# RimeTts 配置文件
# 配置文件必须与 EXE 在同一目录下
FileInteractor:
  # Lua 侧写入内容的 JSON 文件路径
  ContentFile: "D:/Program Files/Rime/User_Data/rimetts_content.json"
  # Lua 侧触发信号的文件路径（C# 监听此文件变化）
  SignalFile: "D:/Program Files/Rime/User_Data/rimetts_signal"
SentenceSeg:
  # 最后一次上屏后多少毫秒认为一个句子结束，默认 5000
  NoCommitGapMs: 5000
Translator:
  # LLM API Key
  ApiKey: "sk-xxxxxxxxxxxxxxxx"
  # API 地址（兼容 OpenAI 协议的接口均可）
  BaseUrl: "https://api.siliconflow.cn/v1/chat/completions"
  # 模型名（推荐使用响应速度快的）
  Model: "Qwen/Qwen2.5-72B-Instruct"
  # 请求超时秒数
  TimeoutSec: 20
  # 默认翻译系统提示词（可完全自定義）
  DefaultSystemPrompt: |
    You are a translator. Detect the input language by yourself and fill UserInputLang.
    Return YAML only:
    
    UserInputLang: zh
    TargetLang: en
    Translation: Translated Text
    
    If you cannot translate, set Translation to null.
    Do not wrap in markdown fences.
Tts:
  # 全局默认 TTS 引擎优先级（某语言未配置 TtsEngines 时使用）
  Engines: ["gTTS", "SystemSpeech"]
  # 生成的音频文件输出目录（留空则使用 EXE 目录下 tts-output）
  OutputDir: ""
LanguagePipeline:
  # 语种顺序即翻译和播放顺序
  Languages:
    - Language: "en"
      SystemPrompt: |
        You are a translator. Detect the input language by yourself and fill UserInputLang.
        Return YAML only. example:

        UserInputLang: zh
        TargetLang: en
        Translation: Translated Text

        If you cannot translate, set Translation to null.
        Do not wrap in markdown fences.
      TtsEngines: ["gTTS", "SystemSpeech"]
    - Language: "ja"
      SystemPrompt: |
        あなたは翻訳者です。入力言語は自分で判定して UserInputLang に入れてください。
        YAML のみを返してください:
        
        UserInputLang: zh
        TargetLang: ja
        Translation: 翻訳文
        
        翻訳できない場合は Translation を null にしてください。
        Markdown のコードフェンスは付けないでください。
      TtsEngines: ["gTTS", "SystemSpeech"]

